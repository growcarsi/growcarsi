<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap - GrowÇarşı</title>
  <link rel="stylesheet" href="lib/style.css"> <style>
    /* Giriş sayfasına özel ufak ve şık bir stil */
    .login-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
    }
    .login-box {
      background: #111926; /* FAQ'da seçtiğimiz o güzel gece mavisi kanka */
      border: 1px solid rgba(255, 200, 22, 0.2);
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      color: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .login-box h2 { text-align: center; margin-bottom: 20px; color: #FFC816; }
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; margin-bottom: 5px; font-size: 14px; }
    .input-group input {
      width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #2d3748;
      background: #1a202c; color: #fff; box-sizing: border-box;
    }
    .login-btn {
      width: 100%; padding: 12px; background: #FFC816; border: none;
      border-radius: 6px; color: #111; font-weight: bold; cursor: pointer;
      font-size: 16px; transition: background 0.2s;
    }
    .login-btn:hover { background: #e0b213; }
    .error-msg { color: #ff4655; font-size: 13px; margin-top: 10px; text-align: center; display: none; }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-box">
      <h2>GrowÇarşı Giriş</h2>
      <form id="login-form">
        <div class="input-group">
          <label for="email">E-posta Adresi</label>
          <input type="email" id="email" required placeholder="ornek@gmail.com">
        </div>
        <div class="input-group">
          <label for="password">Şifre</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
       <button type="submit" class="login-btn">Giriş Yap</button>

<div style="text-align: center; margin-top: 15px; font-size: 14px;">
  <span style="color: #ccc;">Hesabın yok mu?</span> 
  <a href="register.html" style="color: #FFC816; text-decoration: none; font-weight: bold; margin-left: 5px;">Kayıt Ol</a>
</div>
        <div id="error-message" class="error-msg"></div>
      </form>
      <div style="text-align: center; margin: 15px 0; color: #666; font-size: 14px;">veya</div>

<button type="button" id="google-login-btn" style="width: 100%; padding: 12px; background: #fff; border: 1px solid #ddd; border-radius: 6px; color: #333; font-weight: bold; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background 0.2s;">
  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M5.266 9.765A7.077 7.077 0 0 1 12 4.909c1.69 0 3.218.6 4.418 1.582L19.91 3C17.782 1.145 15.055 0 12 0 7.27 0 3.198 2.698 1.24 6.65l4.026 3.115Z"/><path fill="#FBBC05" d="M16.04 15.341c-1.07.73-2.435 1.15-4.04 1.15a7.096 7.096 0 0 1-6.733-4.9c-.13-.39-.207-.8-.207-1.235s.078-.846.207-1.236L1.24 6.65A11.962 11.962 0 0 0 0 11.996c0 1.92.453 3.733 1.258 5.35l4.05-3.14-.015.015Z"/><path fill="#4285F4" d="M23.49 12.275c0-.826-.075-1.62-.21-2.386H12v4.512h6.44a5.514 5.514 0 0 1-2.4 3.615l3.774 2.927c2.208-2.034 3.676-5.033 3.676-8.668Z"/><path fill="#34A853" d="M19.814 18.043c-2.13 1.952-5.074 3.126-7.814 3.126a7.095 7.095 0 0 1-6.748-4.915l-4.05 3.141C3.15 23.321 7.243 26 12 26c3.153 0 6.043-1.045 8.218-2.851l-4.03-3.142.364-.264Z"/></svg>
  Google ile Giriş Yap
</button>
    </div>
  </div>

  <script type="module">
import { auth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "./auth.js";

    const loginForm = document.getElementById("login-form");
    const errorDiv = document.getElementById("error-message");

    loginForm.addEventListener("submit", (e) => {
      e.preventDefault(); // Sayfanın yenilenmesini engelle kanka
      
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      errorDiv.style.display = "none";

      // Firebase ile giriş yapmayı deniyoruz
      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          // Giriş başarılıysa ana sayfaya uçuruyoruz kanka
          window.location.href = "/"; 
        })
        .catch((error) => {
          errorDiv.style.display = "block";
          errorDiv.innerText = "Hatalı e-posta veya şifre girdin kanka!";
          console.error("Giriş hatası detay:", error.message);
        });
    });


    const googleBtn = document.getElementById("google-login-btn");
if (googleBtn) {
  googleBtn.addEventListener("click", () => {
    const provider = new GoogleAuthProvider();
    
    // Google pop-up ekranını fırlatıyoruz
    signInWithPopup(auth, provider)
      .then((result) => {
        console.log("Google ile giriş başarılı kanka:", result.user);
        window.location.href = "index.html"; // Ana sayfaya uçur
      })
      .catch((error) => {
        const errorDiv = document.getElementById("error-message");
        if (errorDiv) {
          errorDiv.style.display = "block";
          errorDiv.innerText = "Google girişinde bir sorun çıktı reis!";
        }
        console.error("Google Auth Hatası:", error.message);
      });
  });
}
  </script>
</body>
</html>
