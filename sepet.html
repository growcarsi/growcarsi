<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sepetim - GrowÇarşı</title>
  <link rel="stylesheet" href="/lib/assets/style.css">
    <link rel="stylesheet" href="/lib/assets/products.css">
  <link rel="stylesheet" href="/lib/assets/sepet.css">
</head>
<body>

  <header class="main-navbar">
    <div class="nav-container">
      <div class="nav-brand">
        <a href="/"><img src="/lib/assets/imgs/growcarsilogo.png" alt="GrowÇarşı" class="logo"></a>
      </div>
      <div class="nav-search">
        <input type="text" placeholder="Ürün veya hesap ara...">
        <button type="button">ARA</button>
      </div>
      <div class="nav-cart">
        <a href="/sepet" class="cart-btn">
          <img src="/lib/assets/imgs/urun/sepet-icon.png" alt="Sepet" class="cart-icon">
          <div class="cart-info-wrapper">
            <span class="cart-text">Sepetim</span>
            <span class="cart-helper-text">Ödeme Yapmak İçin Tıkla</span>
          </div>
          <span class="cart-badge" id="nav-cart-badge">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="cart-page-wrapper">
    <div class="cart-page-container">
      
      <div class="cart-left-block">
        <h2>Sepetim (<span id="cart-count">0</span> Ürün)</h2>
        
        <div id="cart-items-list">
          </div>

        <div class="cart-left-footer">
          <a href="/" class="continue-shopping-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
            Alışverişe Devam Et
          </a>
        </div>
      </div>

      <div class="cart-right-block">
        <div class="summary-sticky-box">
          <h3>Sepet Özeti</h3>
          
          <div class="summary-row">
            <span>Ürünler Toplamı</span>
            <span id="summary-subtotal">0.00 TL</span>
          </div>
          <div class="summary-row">
            <span>KDV / Hizmet Bedeli</span>
            <span>0.00 TL</span>
          </div>
          
          <div class="summary-total-row">
            <span>Ödenecek Tutar</span>
            <span id="summary-total">0.00 TL</span>
          </div>

          <button type="button" class="checkout-complete-btn" id="checkout-btn">
            Alışverişi Tamamla
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
            </svg>
          </button>
        </div>
      </div>

    </div>
  </main>

<script src="sepet.js"></script>
  
  <div id="checkoutModalContainer"></div>
</body>
</html>
